<!-- Form 6.1: DRP Test Log -->
<div class="itgc-card">
  <div class="itgc-card-header">
    <h1 class="itgc-card-title">
      <i class="bi bi-activity text-danger"></i>
      Form 6.1: DRP Test Log (บันทึกการซ้อมแผนฉุกเฉิน DRP)
    </h1>
    <span class="badge bg-secondary">BCP / DRP Team Log</span>
  </div>

  <form id="form-6-1" onsubmit="handleForm6_1Submit(event)">
    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <label class="form-label">วันที่ทดสอบ DRP <span class="text-danger">*</span></label>
        <input type="date" id="drp-date" class="form-control" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">หัวข้อทดสอบ (Subject) <span class="text-danger">*</span></label>
        <input type="text" id="drp-subject" class="form-control" required placeholder="เช่น การจำลองทดสอบสลับระบบไปยัง Disaster Recovery Site">
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">รายละเอียดการทดสอบ (Detail) <span class="text-danger">*</span></label>
      <textarea id="drp-detail" class="form-control" rows="3" required placeholder="ระบุเหตุการณ์ ขั้นตอน และผลลัพธ์ของการทดสอบ..."></textarea>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <label class="form-label">ผลการทดสอบ <span class="text-danger">*</span></label>
        <div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="DrpResult" id="drp-pass" value="ผ่าน" checked>
            <label class="form-check-label text-success fw-bold" for="drp-pass">ผ่าน (Success)</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="DrpResult" id="drp-fail" value="ไม่ผ่าน">
            <label class="form-check-label text-danger fw-bold" for="drp-fail">ไม่ผ่าน (Failed)</label>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <label class="form-label">เลือก Profile ผู้อนุมัติ/รับทราบ <span class="text-danger">*</span></label>
        <select id="drp-approve-profile" class="form-select" required>
          <option value="">-- เลือก Profile ผู้อนุมัติ --</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">แนบไฟล์หลักฐาน (PDF)</label>
        <input type="file" id="drp-file-input" class="form-control" accept="application/pdf">
      </div>
    </div>

    <div class="d-flex justify-content-end gap-2">
      <button type="submit" class="btn btn-itgc-primary">
        <i class="bi bi-save"></i> บันทึก DRP Log & สร้าง Link อนุมัติ
      </button>
    </div>
  </form>
</div>

<script>
async function init_Form_6_1() {
  initDatePicker('#drp-date');

  try {
    const master = await apiFetch('get_master_data');
    const profSelect = document.getElementById('drp-approve-profile');
    profSelect.innerHTML = '<option value="">-- เลือก Profile ผู้อนุมัติ --</option>';
    master.approveProfiles.forEach(p => {
      profSelect.innerHTML += `<option value="${p.Profile_Name}">${p.Profile_Name} (${p.FullName} - ${p.Department})</option>`;
    });
  } catch (e) {
    console.error(e);
  }
}

async function handleForm6_1Submit(e) {
  e.preventDefault();

  const fileInput = document.getElementById('drp-file-input');
  let base64File = null;
  if (fileInput.files && fileInput.files.length > 0) {
    base64File = await fileToBase64(fileInput.files[0]);
  }

  const payload = {
    Test_Date: document.getElementById('drp-date').value,
    Subject: document.getElementById('drp-subject').value.trim(),
    Detail: document.getElementById('drp-detail').value.trim(),
    Result: document.querySelector('input[name="DrpResult"]:checked').value,
    Approve_Profile: document.getElementById('drp-approve-profile').value,
    UploadData: base64File
  };

  try {
    const res = await apiFetch('submit_drp_test', payload);
    const deepLinkUrl = `${window.location.origin}${window.location.pathname}?action=approve&form=6_2&req_id=${res.drpId}`;

    Swal.fire({
      title: 'บันทึกสำเร็จ!',
      html: `
        <p>${res.message} (DRP_ID: <strong>${res.drpId}</strong>)</p>
        <p class="text-start mb-1 fw-bold">กรุณา Copy Deep Link นี้ส่งให้ผู้บริหาร (${payload.Approve_Profile}) เพื่อกดรับทราบ:</p>
        <div class="input-group mb-3">
          <input type="text" class="form-control" value="${deepLinkUrl}" readonly onclick="this.select()">
          <button class="btn btn-outline-primary" onclick="navigator.clipboard.writeText('${deepLinkUrl}'); alert('คัดลอก ลิงก์เรียบร้อย!');">Copy</button>
        </div>
      `,
      icon: 'success'
    });

    document.getElementById('form-6-1').reset();
    init_Form_6_1();
  } catch (err) {
    console.error(err);
  }
}
</script>
