<!-- Form 1.3: Access Review (ประจำปี) -->
<div class="itgc-card">
  <div class="itgc-card-header">
    <h1 class="itgc-card-title">
      <i class="bi bi-shield-check"></i>
      Form 1.3: Access Review (แบบทบทวนสิทธิ์ประจำปี)
    </h1>
    <span class="badge bg-secondary">IT Staff Record</span>
  </div>

  <form id="form-1-3" onsubmit="handleForm1_3Submit(event)">
    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <label class="form-label">เลือกเครื่องคอมพิวเตอร์ที่ต้องการตรวจสอบ <span class="text-danger">*</span></label>
        <select id="review-computer-name" class="form-select" required onchange="fetchAccessReviewDetails()">
          <option value="">-- เลือกเครื่องคอมพิวเตอร์ --</option>
        </select>
        <div class="form-text">ระบบจะดึงผู้ถือครองและสิทธิ์การใช้งานล่าสุดมาให้อัตโนมัติ</div>
      </div>
      <div class="col-md-6">
        <label class="form-label">วันที่ทบทวนสิทธิ์</label>
        <input type="text" id="review-date" class="form-control" readonly>
      </div>
    </div>

    <!-- Auto-fetched Owner & Role Details (Read-only) -->
    <div class="p-3 mb-4 bg-light rounded border">
      <h6 class="fw-bold text-navy mb-3"><i class="bi bi-info-circle-fill"></i> ข้อมูลผู้ถือครองและสิทธิ์ปัจจุบันในระบบ</h6>
      <div class="row g-3">
        <div class="col-md-3">
          <label class="form-label">รหัสพนักงานผู้ถือครอง</label>
          <input type="text" id="review-emp-code" class="form-control" readonly placeholder="-">
        </div>
        <div class="col-md-3">
          <label class="form-label">ชื่อ-นามสกุล</label>
          <input type="text" id="review-fullname" class="form-control" readonly placeholder="-">
        </div>
        <div class="col-md-3">
          <label class="form-label">O365 Email</label>
          <input type="text" id="review-email" class="form-control" readonly placeholder="-">
        </div>
        <div class="col-md-3">
          <label class="form-label">สิทธิ์ปัจจุบัน (Current Role)</label>
          <input type="text" id="review-role" class="form-control fw-bold text-primary" readonly placeholder="-">
        </div>
      </div>
    </div>

    <!-- Review Inspection Inputs -->
    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <label class="form-label">ผลการตรวจสอบสิทธิ์ <span class="text-danger">*</span></label>
        <div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="Result" id="result-pass" value="ผ่าน" checked>
            <label class="form-check-label text-success fw-bold" for="result-pass"><i class="bi bi-check-circle"></i> ผ่าน (ตรงตามสิทธิ์ที่ได้รับ)</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="Result" id="result-fail" value="ไม่ผ่าน">
            <label class="form-check-label text-danger fw-bold" for="result-fail"><i class="bi bi-x-circle"></i> ไม่ผ่าน (พบความไม่สอดคล้อง)</label>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <label class="form-label">หมายเหตุการตรวจสอบ</label>
        <textarea id="review-remark" class="form-control" rows="2" placeholder="ระบุรายละเอียดเพิ่มเติมกรณีไม่ผ่าน..."></textarea>
      </div>
    </div>

    <!-- Submit Button -->
    <div class="d-flex justify-content-end gap-2">
      <button type="submit" class="btn btn-itgc-primary">
        <i class="bi bi-save"></i> บันทึก Access Review & สร้าง PDF
      </button>
    </div>
  </form>
</div>

<script>
async function init_Form_1_3() {
  initDatePicker('#review-date');

  try {
    const master = await apiFetch('get_master_data');
    const compSelect = document.getElementById('review-computer-name');
    compSelect.innerHTML = '<option value="">-- เลือกเครื่องคอมพิวเตอร์ --</option>';
    master.assets.forEach(a => {
      compSelect.innerHTML += `<option value="${a.Computer_Name}">${a.Computer_Name}</option>`;
    });
  } catch (e) {
    console.error(e);
  }
}

async function fetchAccessReviewDetails() {
  const compName = document.getElementById('review-computer-name').value;
  if (!compName) return;

  try {
    const data = await apiFetch('get_access_review_details', { computerName: compName });
    document.getElementById('review-emp-code').value = data.Emp_Code || 'ไม่พบข้อมูล';
    document.getElementById('review-fullname').value = data.FullName || 'ไม่พบข้อมูล';
    document.getElementById('review-email').value = data.O365_Email || 'ไม่พบข้อมูล';
    document.getElementById('review-role').value = data.Current_Role || 'ไม่พบข้อมูล';
  } catch (e) {
    console.error(e);
  }
}

async function handleForm1_3Submit(e) {
  e.preventDefault();

  const compName = document.getElementById('review-computer-name').value;
  if (!compName) {
    showAlert('ข้อมูลไม่ครบถ้วน', 'กรุณาเลือกเครื่องคอมพิวเตอร์ที่ต้องการทบทวนสิทธิ์', 'warning');
    return;
  }

  const payload = {
    Computer_Name: compName,
    Emp_Code: document.getElementById('review-emp-code').value,
    FullName: document.getElementById('review-fullname').value,
    O365_Email: document.getElementById('review-email').value,
    Current_Role: document.getElementById('review-role').value,
    Result: document.querySelector('input[name="Result"]:checked').value,
    Remark: document.getElementById('review-remark').value
  };

  try {
    const res = await apiFetch('submit_access_review', payload);
    Swal.fire({
      title: 'บันทึกเรียบร้อย!',
      html: `
        <p>${res.message} (Rev_ID: <strong>${res.revId}</strong>)</p>
        ${res.pdfUrl ? `<a href="${res.pdfUrl}" target="_blank" class="btn btn-primary mt-2"><i class="bi bi-file-pdf"></i> ดาวน์โหลด PDF หลักฐาน</a>` : ''}
      `,
      icon: 'success'
    });

    document.getElementById('form-1-3').reset();
    init_Form_1_3();
  } catch (err) {
    console.error(err);
  }
}
</script>
