<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="IT Management & COSO-ITGC Compliance System - Paperless System for IPO Audit Readiness">
  <title>IT Management & COSO-ITGC Compliance System</title>

  <!-- Google Fonts: Prompt & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS & Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">

  <!-- SweetAlert2 & Flatpickr CSS -->
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Loading Overlay Spinner -->
  <div id="global-spinner" class="d-none">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">กำลังโหลด...</span>
    </div>
    <p class="mt-3 fw-bold text-navy" style="color: #0F172A;">กำลังประมวลผลระบบ ITGC...</p>
  </div>

  <!-- Header / Navbar -->
  <header class="app-header">
    <div class="app-brand">
      <i class="bi bi-shield-lock-fill"></i>
      <span>ITGC Compliance System</span>
      <span class="badge bg-primary fs-7 ms-2">v4.3</span>
    </div>

    <div class="user-profile-badge" id="user-badge-container">
      <i class="bi bi-person-circle"></i>
      <span id="user-display-name">กำลังตรวจสอบสิทธิ์...</span>
    </div>
  </header>

  <!-- App Wrapper (Sidebar + Main Content) -->
  <div class="app-wrapper">

    <!-- Sidebar Navigation Menu -->
    <aside class="app-sidebar" id="app-sidebar">
      <div id="sidebar-menu-list">
        <!-- Menu list items dynamically rendered via app.js -->
      </div>
    </aside>

    <!-- Main View Container (Single Page Application SPA) -->
    <main class="app-content">
      <div id="view-container">
        <!-- Dynamic view content loaded here from /views/Form_X_Y.html -->
      </div>
    </main>

  </div>

  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- Bootstrap 5 JS Bundle, SweetAlert2 & Flatpickr JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

  <!-- Application Scripts -->
  <script src="assets/js/clientUtils.js"></script>
  <script src="assets/js/app.js"></script>

</body>
</html>
